<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Yellow circle background -->
  <circle cx="32" cy="32" r="28" fill="#FFD700"/>
  
  <!-- Rocket body -->
  <ellipse cx="32" cy="22" rx="6" ry="12" fill="#FF6B6B"/>
  
  <!-- Rocket window -->
  <circle cx="32" cy="14" r="3" fill="#1E90FF"/>
  
  <!-- Rocket nose cone -->
  <polygon points="32,6 35,12 29,12" fill="#FF6B6B"/>
  
  <!-- Left wing -->
  <polygon points="26,32 20,40 24,32" fill="#FF8C00"/>
  
  <!-- Right wing -->
  <polygon points="38,32 44,40 40,32" fill="#FF8C00"/>
  
  <!-- Flame 1 -->
  <polygon points="30,44 28,54 32,46" fill="#FF4500"/>
  
  <!-- Flame 2 -->
  <polygon points="34,44 36,54 32,46" fill="#FFD700"/>
</svg>
