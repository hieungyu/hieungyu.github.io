<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Yellow gradient background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE135;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  
  <!-- Rocket body (main tube) -->
  <rect x="42" y="18" width="16" height="50" rx="8" fill="#FF3B30"/>
  
  <!-- Rocket window -->
  <circle cx="50" cy="28" r="5" fill="#87CEEB"/>
  
  <!-- Rocket nose cone (triangle) -->
  <polygon points="50,8 58,22 42,22" fill="#FF3B30"/>
  
  <!-- Left wing -->
  <polygon points="42,48 28,65 38,50" fill="#FF8C00"/>
  
  <!-- Right wing -->
  <polygon points="58,48 72,65 62,50" fill="#FF8C00"/>
  
  <!-- Flame 1 (left) -->
  <polygon points="44,68 36,88 42,72" fill="#FF6B00"/>
  
  <!-- Flame 2 (right) -->
  <polygon points="56,68 64,88 58,72" fill="#FFB800"/>
  
  <!-- Flame core (middle) -->
  <polygon points="50,70 48,85 50,75 52,85" fill="#FFFF00"/>
</svg>
